# Local override for Grok Bot box: Docker bridge TCP between containers is broken
# (Tailscale/iptables). Run Kestra on host network and talk to published Postgres :5433.
# Backend stays on :8080; Kestra listens on :8090.
services:
  kestra:
    network_mode: host
    environment:
      KESTRA_CONFIGURATION: |
        micronaut:
          server:
            port: 8090
        datasources:
          postgres:
            url: jdbc:postgresql://127.0.0.1:5433/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${WB_DATA_KESTRA_DB_PASSWORD:?Set WB_DATA_KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${WB_DATA_KESTRA_USERNAME:-admin@kestra.io}
              password: ${WB_DATA_KESTRA_PASSWORD:?Set WB_DATA_KESTRA_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
          url: http://127.0.0.1:8090/
    ports: !reset []
