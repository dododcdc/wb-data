services:
  wb-data-transfer-mysql:
    image: mysql:8.4
    container_name: wb-data-transfer-mysql
    environment:
      MYSQL_DATABASE: transfer_demo
      MYSQL_USER: wbdata
      MYSQL_PASSWORD: wbdata123
      MYSQL_ROOT_PASSWORD: wbdata-root-dev
    ports:
      - "13306:3306"
    volumes:
      - wb-data-transfer-mysql-data:/var/lib/mysql
      - ./scripts/dev/init/transfer/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - wb-data-integration

  wb-data-transfer-hive:
    image: apache/hive:4.0.0
    container_name: wb-data-transfer-hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "11000:10000"
      - "11002:10002"
    volumes:
      - wb-data-transfer-hive-warehouse:/opt/hive/data/warehouse
      - ./scripts/dev/init/transfer/hive/001_schema.sql:/opt/hive/scripts/001_schema.sql:ro
    networks:
      - wb-data-integration

  wb-data-transfer-backend-network-alias:
    image: alpine/socat:1.8.0.3-r0
    container_name: wb-data-transfer-backend-network-alias
    command:
      - TCP-LISTEN:8080,fork,reuseaddr
      - TCP:host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - wb-data-integration

  wb-data-transfer-kestra:
    image: kestra/kestra:v1.3.28
    container_name: wb-data-transfer-kestra
    user: root
    command: server standalone --config /etc/config/application.yml
    environment:
      WB_DATA_INTERNAL_BASE_URL: http://wb-data-transfer-backend-network-alias:8080
      WB_DATA_INTERNAL_TOKEN: dev-transfer-token
    ports:
      - "18090:8080"
    volumes:
      - ./docker/kestra-transfer/application.yml:/etc/config/application.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - wb-data-transfer-kestra-storage:/app/storage
      - wb-data-transfer-kestra-tmp:/tmp/kestra-wd/tmp
    depends_on:
      wb-data-transfer-mysql:
        condition: service_healthy
      wb-data-transfer-hive:
        condition: service_started
      wb-data-transfer-backend-network-alias:
        condition: service_started
    networks:
      - wb-data-integration

networks:
  wb-data-integration:
    name: wb-data-integration

volumes:
  wb-data-transfer-mysql-data:
  wb-data-transfer-hive-warehouse:
  wb-data-transfer-kestra-storage:
  wb-data-transfer-kestra-tmp:
