services:
  wb-data-seatunnel:
    image: ${WB_DATA_TRANSFER_SEATUNNEL_IMAGE:-wb-data-seatunnel:2.3.13}
    build:
      context: .
      dockerfile: docker/seatunnel/Dockerfile
      args:
        SEATUNNEL_BASE_IMAGE: ${WB_DATA_TRANSFER_SEATUNNEL_BASE_IMAGE:-apache/seatunnel:2.3.13}
        HIVE_JDBC_VERSION: ${WB_DATA_TRANSFER_HIVE_JDBC_VERSION:-3.1.3}
        HIVE_JDBC_SHA1: ${WB_DATA_TRANSFER_HIVE_JDBC_SHA1:-a5b6b2f2afbb2b9d5b2bca9396d6e16da8c18edb}
    profiles:
      - build

  wb-data-transfer-mysql:
    image: ${WB_DATA_TRANSFER_MYSQL_IMAGE:-mysql:8.0}
    container_name: wb-data-transfer-mysql
    environment:
      MYSQL_DATABASE: transfer_demo
      MYSQL_USER: wbdata
      MYSQL_PASSWORD: wbdata123
      MYSQL_ROOT_PASSWORD: wbdata-root-dev
    ports:
      - "13306:3306"
    volumes:
      - wb-data-transfer-mysql-data:/var/lib/mysql
      - ./scripts/dev/init/transfer/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  wb-data-transfer-mysql-data:
