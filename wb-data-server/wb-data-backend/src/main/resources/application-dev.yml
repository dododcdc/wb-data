# 本地开发默认值。通过 SPRING_PROFILES_ACTIVE=dev 启用；路径默认值基于启动目录（user.dir）拼出绝对路径。
# 生产部署不要使用本 profile，所有敏感配置通过环境变量显式注入。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${WB_DATA_INFRA_HOST:omarchy.local}:3306/wb_data?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    password: ${DB_PASSWORD:1111}

wbdata:
  security:
    # 仅限本地 dev profile 使用；生产部署务必通过 WB_DATA_SECRET_KEY 显式注入强密钥
    secret-key: ${WB_DATA_SECRET_KEY:${WB_DATA_GIT_TOKEN_KEY:wb-data-local-dev-secret-key-do-not-use-in-prod}}
  plugins:
    dir: ${WB_DATA_PLUGIN_DIR:${user.dir}/../../plugins}
  offline:
    repo-base-dir: ${WB_DATA_OFFLINE_REPO_BASE_DIR:${user.dir}/../../output/offline-live/repos}
    transfer:
      # 仅限本地 dev profile 使用；生产部署务必通过 WB_DATA_TRANSFER_INTERNAL_TOKEN 显式注入强令牌
      internal-token: ${WB_DATA_TRANSFER_INTERNAL_TOKEN:wb-data-local-dev-internal-token}
      container-host-rewrite: ${WB_DATA_TRANSFER_CONTAINER_HOST_REWRITE:host.docker.internal}
    kestra:
      base-url: ${WB_DATA_KESTRA_BASE_URL:http://${WB_DATA_INFRA_HOST:omarchy.local}:8090}
      username: ${WB_DATA_KESTRA_USERNAME:admin@kestra.io}
      password: ${WB_DATA_KESTRA_PASSWORD:Admin1234!}

